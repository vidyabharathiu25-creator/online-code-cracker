<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registered Users</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#f4f7fb;
padding:30px;

}

.container{

max-width:1200px;
margin:auto;

}

h1{

color:#333;
margin-bottom:25px;

}

table{

width:100%;
border-collapse:collapse;
background:white;

box-shadow:0 10px 20px rgba(0,0,0,.1);

}

th{

background:#667eea;
color:white;
padding:15px;

}

td{

padding:15px;
text-align:center;
border-bottom:1px solid #ddd;

}

tr:hover{

background:#f8f8f8;

}

.back{

display:inline-block;
margin-bottom:20px;
padding:12px 20px;
background:#667eea;
color:white;
text-decoration:none;
border-radius:10px;

}

.back:hover{

background:#5563d8;

}

</style>

</head>

<body>

<div class="container">

<a href="{{ url_for('admin_dashboard') }}" class="back">

<i class="fa fa-arrow-left"></i>

Back to Dashboard

</a>

<h1>

Registered Users

</h1>

<table>

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Username</th>

</tr>

{% for user in users %}

<tr>

<td>{{ user.id }}</td>

<td>{{ user.name }}</td>

<td>{{ user.email }}</td>

<td>{{ user.username }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
