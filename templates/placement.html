<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Placement Preparation</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4facfe,#6a5acd);
}

.container{
width:90%;
max-width:1000px;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,.2);
text-align:center;
}

h1{
margin-bottom:10px;
color:#333;
}

p{
color:#666;
margin-bottom:35px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:25px;
}

.card{
text-decoration:none;
color:white;
padding:35px;
border-radius:18px;
transition:.3s;
font-size:22px;
font-weight:bold;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.card i{
font-size:50px;
margin-bottom:15px;
display:block;
}

.card:hover{
transform:translateY(-8px) scale(1.03);
}

.apti{
background:linear-gradient(135deg,#00c853,#43a047);
}

.logical{
background:linear-gradient(135deg,#ff9800,#f57c00);
}

.verbal{
background:linear-gradient(135deg,#2196f3,#1565c0);
}

.passage{
background:linear-gradient(135deg,#e91e63,#c2185b);
}

.back{
display:inline-block;
margin-top:35px;
text-decoration:none;
background:#444;
color:white;
padding:12px 30px;
border-radius:30px;
font-weight:bold;
}

.back:hover{
background:#222;
}

@media(max-width:768px){

.grid{
grid-template-columns:1fr;
}

.card{
padding:30px;
}

}

</style>

</head>

<body>

<div class="container">

<h1><i class="fa-solid fa-graduation-cap"></i> Placement Preparation</h1>

<p>Select a category to begin your preparation</p>

<div class="grid">

<a href="{{ url_for('aptitude') }}" class="card apti">
<i class="fa-solid fa-calculator"></i>
Aptitude
</a>

<a href="{{ url_for('logical') }}" class="card logical">
<i class="fa-solid fa-brain"></i>
Logical Reasoning
</a>

<a href="{{ url_for('verbal') }}" class="card verbal">
<i class="fa-solid fa-book-open"></i>
Verbal Ability
</a>

<a href="{{ url_for('passage') }}" class="card passage">
<i class="fa-solid fa-file-lines"></i>
Reading Comprehension
</a>

</div>

<a href="{{ url_for('dashboard') }}" class="back">
<i class="fa-solid fa-arrow-left"></i>
Dashboard
</a>

</div>

</body>
</html>
