<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Email - Quiz Master</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #4facfe, #764ba2);
        }

        .verification-box {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            background: white;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
        }

        .email-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: #eef4ff;
            font-size: 38px;
        }

        h2 {
            color: #333;
            margin-bottom: 12px;
        }

        .description {
            color: #777;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .error {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #ffe5e5;
            color: #d00000;
            font-size: 13px;
        }

        .otp-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #dddddd;
            border-radius: 10px;
            outline: none;
            text-align: center;
            font-size: 25px;
            letter-spacing: 9px;
            font-weight: 600;
        }

        .otp-input:focus {
            border-color: #667eea;
        }

        .verify-button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4facfe, #764ba2);
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .verify-button:hover {
            opacity: 0.9;
        }

        .note {
            margin-top: 20px;
            color: #888;
            font-size: 12px;
        }

    </style>

</head>

<body>

    <div class="verification-box">

        <div class="email-icon">
            📧
        </div>

        <h2>
            Verify Your Email
        </h2>

        <p class="description">
            A 6-digit verification code has been sent
            to your email address.
            <br>
            Enter the code below to complete registration.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="otp"
                class="otp-input"
                placeholder="000000"
                maxlength="6"
                minlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                required
                autofocus
            >

            <button
                type="submit"
                class="verify-button"
            >
                Verify Email
            </button>

        </form>

        <p class="note">
            This code is valid for 10 minutes.
        </p>

    </div>

</body>
</html>
