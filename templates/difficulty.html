<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }} - Difficulty</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .2);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 35px;
            font-size: 17px;
        }

        .level {
            display: block;
            text-decoration: none;
            color: white;
            font-size: 22px;
            font-weight: bold;
            padding: 18px;
            margin: 18px 0;
            border-radius: 12px;
            transition: .3s;
        }

        .level:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .2);
        }

        .easy {
            background: #28a745;
        }

        .medium {
            background: #ff9800;
        }

        .hard {
            background: #e53935;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            background: #444;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            transition: .3s;
        }

        .back:hover {
            background: #222;
            transform: scale(1.03);
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 26px;
            }

            .level {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>{{ title }}</h1>

    <p class="subtitle">
        Choose Difficulty Level
    </p>

    <!-- EASY -->
    <a href="{{ url_for(route, level='Easy') }}" class="level easy">
        🟢 Easy
    </a>

    <!-- MEDIUM -->
    <a href="{{ url_for(route, level='Medium') }}" class="level medium">
        🟠 Medium
    </a>

    <!-- HARD -->
    <a href="{{ url_for(route, level='Hard') }}" class="level hard">
        🔴 Hard
    </a>

    <!-- BACK -->
    <a href="{{ url_for('placement') }}" class="back">
        <i class="fa-solid fa-arrow-left"></i>
        Back
    </a>

</div>

</body>
</html>
