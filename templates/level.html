<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Select Level</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4facfe,#764ba2);font-family:Arial}.box{width:90%;max-width:800px;background:#fff;border-radius:25px;padding:35px;text-align:center;box-shadow:0 20px 50px #0004}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:25px}.level{padding:25px;color:#fff;text-decoration:none;border-radius:18px;font-weight:bold}.easy{background:#2ecc71}.medium{background:#f39c12}.hard{background:#e74c3c}.back{display:inline-block;margin-top:25px;color:#667eea}@media(max-width:600px){.levels{grid-template-columns:1fr}}</style></head><body><div class="box"><h1>📚 {{ subject }}</h1><p>Select difficulty level</p><div class="levels"><a class="level easy" href="{{ url_for('quiz',subject=subject,level='Easy') }}">🟢 Easy</a><a class="level medium" href="{{ url_for('quiz',subject=subject,level='Medium') }}">🟡 Medium</a><a class="level hard" href="{{ url_for('quiz',subject=subject,level='Hard') }}">🔴 Hard</a></div><a class="back" href="{{ url_for('dashboard') }}">← Dashboard</a></div></body></html>
