<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Master | Admin Login</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}


body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(135deg,
    #667eea,
    #764ba2,
    #43cea2);

    background-size:400% 400%;

    animation:bgAnimation 10s infinite alternate;

}


@keyframes bgAnimation{

    0%{
        background-position:left;
    }

    100%{
        background-position:right;
    }

}



/* MAIN CARD */

.card{

    width:430px;

    background:white;

    padding:45px;

    border-radius:30px;

    box-shadow:
    0 20px 50px rgba(0,0,0,.25);

    animation:slide .8s ease;

}


@keyframes slide{

    from{

        opacity:0;

        transform:translateY(50px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}



/* LOGO */


.logo{

    width:100px;
    height:100px;

    margin:auto;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(135deg,#667eea,#764ba2);

    color:white;

    font-size:42px;

    box-shadow:
    0 10px 25px rgba(102,126,234,.5);

    margin-bottom:25px;

}



/* TEXT */


h2{

    text-align:center;

    color:#333;

    font-size:28px;

    margin-bottom:8px;

}


.subtitle{

    text-align:center;

    color:#777;

    margin-bottom:30px;

}



/* ERROR MESSAGE */


.error{

    background:#ffe6e6;

    color:#d63031;

    padding:12px;

    border-radius:12px;

    text-align:center;

    margin-bottom:20px;

    font-weight:600;

}



/* INPUT */


.input-box{

    position:relative;

    margin-bottom:22px;

}


.input-box input{


    width:100%;

    padding:16px 45px;

    border-radius:15px;

    border:2px solid #eee;

    outline:none;

    font-size:15px;

    transition:.3s;

}


.input-box input:focus{

    border-color:#667eea;

    box-shadow:
    0 0 10px rgba(102,126,234,.3);

}



.icon{

    position:absolute;

    left:15px;

    top:17px;

    color:#667eea;

}


.eye{

    position:absolute;

    right:15px;

    top:17px;

    color:#667eea;

    cursor:pointer;

}



/* BUTTON */


button{


    width:100%;

    padding:16px;

    border:none;

    border-radius:15px;

    cursor:pointer;

    color:white;

    font-size:17px;

    font-weight:bold;


    background:

    linear-gradient(135deg,
    #667eea,
    #764ba2);


    transition:.3s;

}


button:hover{

    transform:translateY(-4px);

    box-shadow:
    0 10px 20px rgba(102,126,234,.4);

}



/* BACK LINK */


.back{

    text-align:center;

    margin-top:25px;

}


.back a{

    color:#667eea;

    text-decoration:none;

    font-weight:bold;

}


.back a:hover{

    text-decoration:underline;

}



/* MOBILE */


@media(max-width:500px){


.card{

    width:90%;

    padding:30px;

}


}


</style>


</head>



<body>


<div class="card">


<div class="logo">

<i class="fa-solid fa-user-shield"></i>

</div>



<h2>

Admin Login

</h2>


<p class="subtitle">

Manage Quiz Master Dashboard

</p>



{% with messages=get_flashed_messages() %}

{% if messages %}

<div class="error">

{{messages[0]}}

</div>

{% endif %}

{% endwith %}



{% if error %}

<div class="error">

{{error}}

</div>

{% endif %}




<form method="POST">


<div class="input-box">


<i class="fa-solid fa-user icon"></i>


<input

type="text"

name="username"

placeholder="Enter Admin Username"

required>


</div>




<div class="input-box">


<i class="fa-solid fa-lock icon"></i>


<input

type="password"

id="password"

name="password"

placeholder="Enter Password"

required>



<i

class="fa-solid fa-eye eye"

id="togglePassword">

</i>


</div>




<button type="submit">


<i class="fa-solid fa-right-to-bracket"></i>

&nbsp;

Login


</button>



</form>




<div class="back">


<a href="{{url_for('login')}}">

<i class="fa-solid fa-arrow-left"></i>

Back to User Login

</a>


</div>



</div>





<script>


const password=document.getElementById("password");

const toggle=document.getElementById("togglePassword");



toggle.onclick=function(){


if(password.type==="password"){


password.type="text";


toggle.classList.remove("fa-eye");

toggle.classList.add("fa-eye-slash");


}

else{


password.type="password";


toggle.classList.remove("fa-eye-slash");

toggle.classList.add("fa-eye");


}


}



</script>



</body>

</html>
