<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title>
<style>body{margin:0;padding:30px 10px;background:linear-gradient(135deg,#4facfe,#764ba2);font-family:Arial}.box{max-width:650px;margin:auto;background:#fff;border-radius:25px;padding:35px;box-shadow:0 20px 45px #0004}h1{text-align:center}.avatar{width:90px;height:90px;border-radius:50%;background:#eef3ff;display:flex;align-items:center;justify-content:center;font-size:50px;margin:20px auto}.info{background:#f5f7ff;padding:15px;border-radius:15px;margin:10px 0}.info b{display:block;color:#666;margin-bottom:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat{text-align:center;background:#f5f7ff;padding:14px;border-radius:15px}.num{font-size:24px;font-weight:bold;color:#667eea}.btn{display:inline-block;margin:20px 5px 0;padding:11px 18px;background:#667eea;color:#fff;text-decoration:none;border-radius:22px}</style></head><body><div class="box"><h1>👤 My Profile</h1><div class="avatar">🎓</div><div class="info"><b>Name</b>{{user.name}}</div><div class="info"><b>Email</b>{{user.email}}</div><div class="info"><b>Username</b>{{user.username}}</div><div class="stats"><div class="stat"><div class="num">{{attempts}}</div>Quizzes</div><div class="stat"><div class="num">{{best_score}}%</div>Best</div><div class="stat"><div class="num">{{average_score}}%</div>Average</div></div><div style="text-align:center"><a class="btn" href="{{url_for('dashboard')}}">🏠 Dashboard</a><a class="btn" href="{{url_for('history')}}">📊 History</a></div></div></body></html>
